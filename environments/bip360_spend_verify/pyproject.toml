[project]
name = "bip360-spend-verify"
version = "0.1.0"
description = "Tool-use environment: verify Bitcoin BIP 360 (P2MR) script-path spends exactly, with reason codes"
tags = ["bitcoin", "consensus", "spec-following", "tool-use", "verifiable"]
requires-python = ">=3.10"
dependencies = ["verifiers>=0.1.3", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["bip360_spend_verify.py", "p2mr.py"]
